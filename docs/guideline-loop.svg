<text x="48" y="748" font-family="DejaVu Sans Mono" font-size="13" fill="#8fa9b7" text-anchor="start" font-weight="normal">Every artifact in this repository sits at one of these five positions. Nothing here exists to produce a number for its own sake.</text>
