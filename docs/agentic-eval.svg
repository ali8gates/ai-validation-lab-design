<text x="48" y="700" font-family="DejaVu Sans Mono" font-size="13" fill="#8fa9b7" text-anchor="start" font-weight="normal">The evaluation is the beginning of the record, not the end of it. Thresholds for every monitoring check are set before deployment,</text>
<text x="48" y="722" font-family="DejaVu Sans Mono" font-size="13" fill="#8fa9b7" text-anchor="start" font-weight="normal">not after the first alert. A tool can be correct at every step and still walk a patient to the wrong place, which is the reason none of</text>
<text x="48" y="744" font-family="DejaVu Sans Mono" font-size="13" fill="#8fa9b7" text-anchor="start" font-weight="normal">these measures are averaged into a single score.</text>
