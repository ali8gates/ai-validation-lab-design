<text x="422" y="521" font-family="DejaVu Sans Mono" font-size="14" fill="#e8f1f5" text-anchor="start" font-weight="normal">handoff</text>
<text x="762" y="521" font-family="DejaVu Sans Mono" font-size="11.5" fill="#8fa9b7" text-anchor="end" font-weight="normal">task completion</text>
<text x="570" y="606" font-family="DejaVu Sans Mono" font-size="12" fill="#8fa9b7" text-anchor="middle" font-weight="normal">deviation from the sequence counts as a deviation</text>
